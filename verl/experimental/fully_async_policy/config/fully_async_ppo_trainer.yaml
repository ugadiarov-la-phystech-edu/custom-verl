hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

async_training:

  # Maximum samples staleness threshold
  staleness_threshold: 0.1

  # Frequency of parameter synchronization between rollouter and trainer, 
  # One step means trainer obtains a batch of required samples
  trigger_parameter_sync_step: 4
  
  # The number of ppo_mini_batches that the FullyAsyncTrainer obtains once
  require_batches: 1

  # When synchronizing parameters, Whether to resume generation when rollout is interrupted.
  # If True, LLMServerClient auto resume generation, making rollout interruption invisible to the AgentLoop.
  partial_rollout: True

  # whether to use trainer do_validate
  use_trainer_do_validate: False

  # Stop-the-world validation: pause generation for the whole validation window
  # so it is a pure time translation of the pipeline (excluded from
  # fully_async/timing/cumulative_training_time)
  serialize_validation: False

  # Freeze generation for the whole checkpoint save (same accounting as above)
  pause_generation_during_save: False

  # Persist the message-queue contents in checkpoints and restore them on resume
  save_queue_state: True

  # Per-replica in-flight prompt-group budget for the rollouter
  # (max_concurrent_samples = bsz_per_dp_rank * num_replicas). null = replicas * 16
  bsz_per_dp_rank: null

  # Trainer-local replay buffer of prompt groups (VCPO replay training loop):
  # each update trains on every unseen group plus a staleness-decayed sample of
  # already-used groups, with frozen insertion-time rewards/advantages
  replay_buffer:

    # Whether to enable the replay-buffer training loop
    # (requires trigger_parameter_sync_step=1 and require_batches=1)
    enable: False

    # Staleness decay time-constant of the replay sampling score 2^(-staleness/tau)
    tau: 16

    # Evict groups staler than this many model updates
    staleness_threshold: 64

    # Pause training while the buffer holds fewer than this many mini-batches
    # of groups (fractional values allowed)
    requires_mini_batches: 1

    # Seed of the replay sampling RNG (persisted in checkpoints)
    sampling_seed: 1234

# Rollout config
rollout:

  # Number of nodes used in the rollout
  nnodes: 1

  # Number of GPUs per node                     
  n_gpus_per_node: 8

  # number of responses (i.e. num sample times). > 1 for grpo
  n: 4

  # total rollout samples # TODO rename to total_rollout_samples
  total_rollout_steps: 100

data:
  # Number of samples generated, currently only support 1
  gen_batch_size: 1

actor_rollout_ref:

  rollout:
    # Must be enabled! Otherwise, log_probs cannot be calculated.
    calculate_log_probs: True

    checkpoint_engine:
      backend: "nccl"

  actor:
    # Must use rollout log probs for training
    use_rollout_log_probs: True

  model:
    # To use remove padding (thd)
    use_remove_padding: True


# Only then will the use of log probs be correct.
# And it can be used in conjunction with other rollout_correction algorithms.
algorithm:
  rollout_correction:
    bypass_mode: True
